# Covariate specifications for CpG meQTL and downstream models

primary_meqtl:
  description: Primary CpG-level cis-meQTL model (AA discovery, region-specific)
  # Locked 2026-08-01: M3a (see meqtl-validation/01_cpg_meqtl_mapping/PHASE1_LOCK_DECISION.md)
  locked_model: M3a
  formula: >
    CpG_methylation ~ SNP_dosage + agedeath + sex + primarydx
    + snpPC1 + snpPC2 + snpPC3 + snpPC4 + snpPC5
    + methPC1 + methPC2 + methPC3 + methPC4 + methPC5
  required_phenotype_columns:
    - agedeath
    - sex
    - primarydx
    - snpPC1
    - snpPC2
    - snpPC3
    - snpPC4
    - snpPC5
  ancestry_pcs:
    - snpPC1
    - snpPC2
    - snpPC3
    - snpPC4
    - snpPC5
  locked_latent_factors:
    - methPC1
    - methPC2
    - methPC3
    - methPC4
    - methPC5
  optional_technical:
    - pmi
    - ph
    - batch
  latent_factor_policy: >
    Locked primary uses methPC1–5 (PCA on M0-residualized CpG phenotypes).
    Do not auto-include a larger surrogate-variable set without a new lock review.
  cell_composition: sensitivity_only
  # Phase 1 lock sensitivity grid (see PHASE1_COVARIATE_SENSITIVITY_PLAN.md)
  sensitivity_models:
    M0: baseline (agedeath+sex+primarydx+snpPC1-5)
    M1: M0 + pmi + ph
    M2: M0 + snpPC6-10
    M3a: M0 + methPC1-5 (PCA on M0 residuals; PEER unavailable) [LOCKED PRIMARY]
    M3b: M0 + methPC1-10
    M3c: M0 + methPC1-15
    M4: M1 + best methPC k (after pilot)
    M5: M0 + RNA MuSiC cellPC1-3 (legacy sensitivity only)
    M6d: M3a + DNAm scMD dnamCellPC1-3 (gated sensitivity only)
  dnam_cell_composition_model:
    model_id: M6d
    formula: M3a + dnamCellPC1 + dnamCellPC2 + dnamCellPC3
    transform: within-model zero replacement + closure + centered log ratio + PCA
    integration_gate: >
      Use only when the region-specific DNAm fractions are bounded, sum to one,
      pass marker/sample coverage QC, and total-neuronal DNAm-RNA concordance has
      Spearman rho >= 0.30 and BH FDR <= 0.05.
    rank_policy: >
      Retain up to three DNAm cell PCs, dropping the highest-numbered PC only
      when needed to preserve full design-matrix rank.
    primary_model_unchanged: true
  lock_status: locked_M3a
  lock_date: 2026-08-01
  lock_rationale: >
    M3a improves λ_NS vs M0 and increases FDR-significant CpG discoveries in all
    three regions while retaining external meQTL enrichment.

vmr_burden:
  description: Primary VMR-level meQTL-burden validation model
  formula: >
    meqtl_burden ~ continuous_predictability + n_tested_cpgs + mean_methylation
    + methylation_variance + mean_coverage + vmr_length + cpg_density
    + local_snp_density + mean_testable_maf + mappability + repeat_overlap
    + genomic_annotation + effective_sample_size
  region_strategy: region_specific_primary_pooled_with_interaction_secondary

matching_variables:
  - n_tested_cpgs
  - methylation_variance
  - mean_coverage
  - vmr_length
  - cpg_density
  - local_snp_density
  - mappability
  - repeat_status
  - genomic_annotation
  - brain_region

sensitivity_covariates:
  toxicology:
    - smoking
    - nicotine
    - cocaine
    - ethanol
    - amphetamines
    - codeine
    - morphine
    - fentanyl
  clinical:
    - antipsychotics
    - lifetime_antipsych
  technical:
    - pmi
    - ph

donor_group_labels:
  AA: Black American
  EA: non-Hispanic white American

diagnosis_coding:
  control: Control
  schizophrenia: Schizo

# ---------------------------------------------------------------------------
# v2 VMR calling (01_vmr_catalog)
# ---------------------------------------------------------------------------
# Covariate handling inside the VMR catalog. These are the variables removed
# BEFORE variable-region discovery, and are separate from the models fit
# downstream in 02+.
vmr_calling:
  pi_locked: false

  # Donor inclusion. V2 defect: all three BA_only 02.pca.R copies hard-coded
  # `region == "caudate"`, so DLPFC and hippocampus discovered VMRs on ~15 fewer
  # donors than they were later modeled on. In v2 the region filter comes from
  # the --region argument and is never a literal.
  filters:
    min_age: 17
    region: from_argument
    race: from_cohort_arm

  # Removed before PCA, to keep population structure out of the methylation PCs.
  genotype_pcs: [snpPC1, snpPC2, snpPC3]

  # Removed to form residual methylation, whose SD defines VMRs.
  methylation_pcs: [PC1, PC2, PC3, PC4, PC5]

  # NOT regressed out during VMR discovery. Age/sex/diagnosis enter downstream
  # models; removing them here would define the biological units conditional on
  # phenotype and is not what the legacy pipeline did.
  not_regressed: [agedeath, sex, primarydx]

  # Cell composition is NOT adjusted during VMR discovery. It enters as a locked
  # sensitivity in 04_repeat_repressive_architecture (RNA MuSiC cellPCs, and DNAm
  # scMD dnamCellPCs for caudate when the integration gate passes).
  cell_composition_strategy: sensitivity_only_in_04
