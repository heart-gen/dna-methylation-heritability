# Covariate specifications for CpG meQTL and downstream models

primary_meqtl:
  description: Primary CpG-level cis-meQTL model (AA discovery, region-specific)
  # Locked 2026-08-01: M3a (see meqtl-validation/01_cpg_meqtl_mapping/PHASE1_LOCK_DECISION.md)
  locked_model: M3a
  formula: >
    CpG_methylation ~ SNP_dosage + agedeath + sex + primarydx
    + snpPC1 + snpPC2 + snpPC3 + snpPC4 + snpPC5
    + methPC1 + methPC2 + methPC3 + methPC4 + methPC5
  required_phenotype_columns:
    - agedeath
    - sex
    - primarydx
    - snpPC1
    - snpPC2
    - snpPC3
    - snpPC4
    - snpPC5
  ancestry_pcs:
    - snpPC1
    - snpPC2
    - snpPC3
    - snpPC4
    - snpPC5
  locked_latent_factors:
    - methPC1
    - methPC2
    - methPC3
    - methPC4
    - methPC5
  optional_technical:
    - pmi
    - ph
    - batch
  latent_factor_policy: >
    Locked primary uses methPC1–5 (PCA on M0-residualized CpG phenotypes).
    Do not auto-include a larger surrogate-variable set without a new lock review.
  # Pinned 2026-09-24. latent_factor_policy names a METHOD; this is the
  # specification. Read by 00_shared/covariate_lock.py::latent_factor_recipe()
  # and executed by 05_cpg_meqtl_burden/_h/01a_estimate_latent_factors.py, which
  # records every value in results/latent-factor-provenance.tsv. The block must
  # be complete or absent: a partial block is refused, because it would look
  # pinned without being pinned.
  latent_factor_recipe:
    method: pca_on_m0_residuals
    # The v1 implementation of this method, re-fitted on the v2 tested CpGs. The
    # v1 factor TABLES are deliberately not reused: they were estimated on the v1
    # VMR catalog's CpGs, which is a different CpG set.
    implementation: "v1 09_estimate_latent_factors.py, re-fitted on v2 tested CpGs"
    seed: 20260730
    n_cpg_subsample: 50000
    n_factors_estimated: 15
    # M0 = agedeath + sex + primarydx + snpPC1-5, i.e. EVERY locked ancestry PC.
    # sensitivity_models defines M3a as "M0 + methPC1-5"; the policy line above
    # does not say whether the residualization carries the ancestry PCs, and this
    # is the answer.
    residualize_on: M0
    cpg_standardization: zscore_per_cpg
    # The subsample is drawn by INDEX, so the row order of the pooled CpG matrix
    # decides which CpGs are selected. AGENTS.md 10.1 requires numeric chromosome
    # ordering; without this key the recipe is not reproducible from its own
    # description.
    cpg_order: chrom_numeric_then_position
    missing_imputation: cpg_mean
    # An explicit solver rather than a library default: sklearn's
    # svd_solver="auto" selects the RANDOMIZED solver at these shapes
    # (153 x 50,000), so the factors would be reproducible only against one
    # sklearn version and a minor-release change could silently alter a
    # production covariate.
    pca_solver: numpy_svd_full
    sign_convention: max_abs_loading_positive
  cell_composition: sensitivity_only
  # Phase 1 lock sensitivity grid (see PHASE1_COVARIATE_SENSITIVITY_PLAN.md)
  sensitivity_models:
    M0: baseline (agedeath+sex+primarydx+snpPC1-5)
    M1: M0 + pmi + ph
    M2: M0 + snpPC6-10
    M3a: M0 + methPC1-5 (PCA on M0 residuals; PEER unavailable) [LOCKED PRIMARY]
    M3b: M0 + methPC1-10
    M3c: M0 + methPC1-15
    M4: M1 + best methPC k (after pilot)
    M5: M0 + RNA MuSiC cellPC1-3 (legacy sensitivity only)
    M6d: M3a + DNAm scMD dnamCellPC1-3 (gated sensitivity only)
  dnam_cell_composition_model:
    model_id: M6d
    formula: M3a + dnamCellPC1 + dnamCellPC2 + dnamCellPC3
    transform: within-model zero replacement + closure + centered log ratio + PCA
    integration_gate: >
      Use only when the region-specific DNAm fractions are bounded, sum to one,
      pass marker/sample coverage QC, and total-neuronal DNAm-RNA concordance has
      Spearman rho >= 0.30 and BH FDR <= 0.05.
    rank_policy: >
      Retain up to three DNAm cell PCs, dropping the highest-numbered PC only
      when needed to preserve full design-matrix rank.
    primary_model_unchanged: true
  lock_status: locked_M3a
  lock_date: 2026-08-01
  lock_rationale: >
    M3a improves λ_NS vs M0 and increases FDR-significant CpG discoveries in all
    three regions while retaining external meQTL enrichment.

vmr_burden:
  description: Primary VMR-level meQTL-burden validation model
  formula: >
    meqtl_burden ~ continuous_predictability + n_tested_cpgs + mean_methylation
    + methylation_variance + mean_coverage + vmr_length + cpg_density
    + local_snp_density + mean_testable_maf + mappability + repeat_overlap
    + genomic_annotation + effective_sample_size
  region_strategy: region_specific_primary_pooled_with_interaction_secondary

matching_variables:
  - n_tested_cpgs
  - methylation_variance
  - mean_coverage
  - vmr_length
  - cpg_density
  - local_snp_density
  - mappability
  - repeat_status
  - genomic_annotation
  - brain_region

sensitivity_covariates:
  toxicology:
    - smoking
    - nicotine
    - cocaine
    - ethanol
    - amphetamines
    - codeine
    - morphine
    - fentanyl
  clinical:
    - antipsychotics
    - lifetime_antipsych
  technical:
    - pmi
    - ph

donor_group_labels:
  AA: Black American
  EA: non-Hispanic white American

diagnosis_coding:
  control: Control
  schizophrenia: Schizo

# ---------------------------------------------------------------------------
# v2 VMR calling (01_vmr_catalog)
# ---------------------------------------------------------------------------
# Covariate handling inside the VMR catalog. These are the variables removed
# BEFORE variable-region discovery, and are separate from the models fit
# downstream in 02+.
vmr_calling:
  pi_locked: true

  # Donor inclusion. V2 defect: all three BA_only 02.pca.R copies hard-coded
  # `region == "caudate"`, so DLPFC and hippocampus discovered VMRs on ~15 fewer
  # donors than they were later modeled on. In v2 the region filter comes from
  # the --region argument and is never a literal.
  filters:
    min_age: 17
    region: from_argument
    race: from_cohort_arm

  # Removed before PCA, to keep population structure out of the methylation PCs.
  genotype_pcs: [snpPC1, snpPC2, snpPC3]

  # Removed to form residual methylation, whose SD defines VMRs.
  methylation_pcs: [PC1, PC2, PC3, PC4, PC5]

  # NOT regressed out during VMR discovery. Age/sex/diagnosis enter downstream
  # models; removing them here would define the biological units conditional on
  # phenotype and is not what the legacy pipeline did.
  not_regressed: [agedeath, sex, primarydx]

  # Cell composition is NOT adjusted during VMR discovery. It enters as a locked
  # sensitivity in 04_repeat_repressive_architecture (RNA MuSiC cellPCs, and DNAm
  # scMD dnamCellPCs for caudate when the integration gate passes).
  cell_composition_strategy: sensitivity_only_in_04

# ---------------------------------------------------------------------------
# Estimation cells (Modules 02 / 03 on a pooled-discovery locus set)
# ---------------------------------------------------------------------------
# Locus-level covariates in 00_shared/locus_io.R have always been
# age + sex + diagnosis, with NO genotype PCs. That is correct for the AA and
# all_individuals arms as run to date: population structure was removed upstream
# by residualizing methylation on pooled snpPC1-3 during VMR discovery
# (vmr_calling.genotype_pcs above).
#
# That upstream adjustment does not control structure WITHIN an AA-only or
# EA-only estimation set, and the pooled leading PCs largely separate AA from EA,
# so inside one group they are close to constant and carry little within-group
# information. PI decision 2026-09-10: estimation cells recompute genotype PCs
# in their own donors and carry them as locus-level covariates.
#
# The PCA is run by 01b_estimation_cells on the pooled pgen restricted to the
# cell's donors (plink2 --keep ... --pca), so eigenvectors are within-group by
# construction. The result is written once per run as covs/genotype_pcs.tsv and
# read by load_observed_locus(); when that file is absent the covariate matrix is
# byte-identical to the pre-2026-09-10 behaviour, so the sealed accepted runs
# reproduce exactly.
estimation_cells:
  pi_locked: true

  # Number and names of within-group PCs added to the Module 02 / 03 locus
  # models. Kept at 3 to match vmr_calling.genotype_pcs; changing it changes the
  # covariate set of both modules and is a PI decision, never a literal in code.
  genotype_pcs: [snpPC1, snpPC2, snpPC3]

  # Everything else in the locus model is unchanged from the arms.
  locus_covariates: [agedeath, sex, primarydx]

  # Cell composition is not adjusted here either; it stays the Module 04
  # sensitivity.
  cell_composition_strategy: sensitivity_only_in_04
