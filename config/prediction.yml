# v2 local SNP prediction settings (03_local_snp_prediction).
#
# PI-locked 2026-08-23 by Kynon J.M. Benjamin.
#
# Context: the legacy endpoint `r_squared_cv` in
# local-snp-prediction/*/01.elastic-net.R is an IN-SAMPLE fit (~0.85). Its honest
# held-out value is ~0.01, and it correlates NEGATIVELY with r2_oof
# (rho ~ -0.05 to -0.07). It must never appear as an input to a v2 model, table
# or figure. Prediction is the SECONDARY translational endpoint; the primary
# biological endpoint is the local SNP contribution score from
# 02_local_genetic_variance; absolute locus-level PVE is not supported.

pi_locked: true

# The primary estimate must be end-to-end out-of-fold: within each outer split,
# held-out donors must not influence residualization, genotype QC/imputation/
# scaling, phenotype-informed SNP selection, cis screening, or any tuning.
evaluation_standard: end_to_end_oof

# Covariate residualization is learned on outer-training donors and APPLIED to
# the held-out donors. The covariate design is the one 02 used at the same loci
# (age + sex + diagnosis, from the Module 01 .covar/.qcovar files), so the two
# endpoints are estimated under the same adjustment.
residualization:
  covariates: from_module_01_covar   # age, sex, diagnosis
  fit_on: outer_training_donors_only

folds:
  outer: 5
  inner: 5
  repeats: 5

elastic_net:
  alpha_grid: [0.1, 0.5, 0.9, 1.0]
  lambda_rule: lambda.min

screen:
  # AGENTS.md 7.3 forbids the ordinary-OLS Haseman-Elston p-value as the
  # production screen without donor-robust or permutation calibration. The lock
  # is therefore HE calibrated by permutation INSIDE the outer-training donors.
  method: he_permutation
  n_permutations: 1000
  alpha: 0.05
  # Deliberately no cross-VMR correction inside the fold. A fold-internal screen
  # decides for ONE locus in isolation; applying BH across VMRs inside the fold
  # would make a locus's per-fold selectivity depend on which other VMRs happen
  # to be in the run. The prespecified rule is a fixed permutation-calibrated
  # alpha = 0.05 within the fold. BH across VMRs is computed only as a REPORTED
  # DIAGNOSTIC on the aggregated screening_pass_frequency, never as the gate.
  multiple_testing: none_within_fold_by_design
  diagnostic_across_vmr: BH
  # A VMR failing its fold-internal screen receives the prespecified null
  # prediction for held-out donors. Failed folds are NOT dropped.
  null_prediction: training_mean

metrics:
  # All computed from POOLED out-of-fold predictions. Negative r2_pred_oof is
  # retained; cor2_oof is never substituted when r2_pred_oof is unfavorable.
  - r2_pred_oof        # 1 - SSE/SST
  - cor2_oof
  - rmse
  - mae
  - calibration_intercept
  - calibration_slope
  - screening_pass_frequency
  - n_predictions_per_donor

# Leakage tripwire. Defect E1 reported ~0.85; an honest run is near zero. A
# median above this is a stop condition in 04_check_prediction.R, not a warning.
leakage_tripwire:
  max_median_r2_pred_oof: 0.5

sensitivity:
  # Literature-comparable arm: full-data screen followed by nested OOF model
  # evaluation. DEFERRED -- not implemented as of 2026-08-23. If implemented it
  # must be labeled explicitly and never presented as the primary estimate.
  full_data_screen_arm: false

model_release:
  inclusion_rule: none   # no predictor is released from this module
