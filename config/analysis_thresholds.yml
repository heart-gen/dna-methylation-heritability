# Analysis thresholds and decision criteria

analysis_schema_version: 2

significance:
  meqtl_fdr: 0.05
  architecture_fdr: 0.05
  external_validation_fdr: 0.05
  transcription_integration_fdr: 0.05
  scz_risk_variant_cpg_fdr: 0.05  # separate family from genome-wide meQTL

matching:
  method: nearest_neighbor
  caliper_sd: 0.25
  replace: false
  balance_smd_max: 0.1

external_meqtl:
  primary_resource_id: jaffe_dlpfc_450k_meqtl
  min_cpg_overlap_for_test: 1000
  require_genome_build_harmonization: true
  require_complete_assay_universe_for_primary_test: true
  pool_incompatible_platforms: false

cross_region:
  downsample_caudate_to_match: true
  compare_standardized_effects: true
  shared_donor_analysis: true

# Donor-group axis (08_region_donor_generalization). PI, 2026-09-18.
#
# `require_interaction_for_ancestry_claim: true` was removed here. It asked for a
# test this design cannot run and must not run: an interaction term needs a
# pooled group x genotype model, and AGENTS.md 7.6 forbids comparing the Module
# 02 score across cells at any level. The key was unsatisfiable, so it licensed
# nothing and guarded nothing. The three keys below say the same restriction
# positively, and unlike the old key they are read and enforced -- see
# 00_shared/gates.R::donor_group_inference_policy() and its callers in
# 02/_h/14_combine_donor_group_cells.R, 03/_h/07_stack_donor_group_predictions.R
# and 08_region_donor_generalization.
#
#   donor_group_inference: the ONLY inference the axis supports. `concordance_only`
#     means the reportable quantity is ordering agreement between the two cells on
#     the shared locus set -- a rank correlation and quartile overlap -- and never
#     a level, a difference, or a per-cell effect size held up against the other.
#   cross_group_raw_score_comparison: whether raw pve_cis_joint_unbounded or
#     local_snp_contribution_score may be compared across cells. FALSE. The score
#     is a within-cell midrank percentile (config/local_genetic_control.yml locks
#     rank_scope: cohort_by_region), so cross-cell levels are not on one scale.
#   ancestry_effect_claim_allowed: whether any observed AA/EA difference may be
#     attributed to ancestry. FALSE, and not merely pending more data: the cells
#     differ in n (EA is roughly half of AA per region), MAF spectrum, LD and SNP
#     availability, and AGENTS.md 7.7 requires all of those be eliminated first.
#     Flipping this to true is a PI act that needs the eliminating analysis in
#     hand, not a config edit.
donor_group:
  donor_group_inference: concordance_only
  cross_group_raw_score_comparison: false
  ancestry_effect_claim_allowed: false
  min_n_per_group_for_stratified: 50

repeat_sensitivity:
  high_mappability_min: 0.9
  snp_proximity_bp: 150
  exclude_segmental_duplications: true
  consolidated_robustness_table: true

phase2_validation_success:
  burden_increases_with_predictability: required
  survives_covariate_adjustment: required
  survives_matched_analysis: required
  direction_consistent_in_ge_2_regions: required
  external_resource_support_ge_1: required

phase7_scz:
  status: active_v1
  primary_region: caudate
  primary_population: AA
  covariate_model: M3a
  cis_window_bp: 500000
  max_illustrative_loci: 5
  ld_r2_proxy_min: 0.8
  v1_analyses: [1, 2, 3, 4, 6_light]
  # Colocalization left `deferred` while no ancestry-matched QTL resource was
  # wired up. PI decision 2026-09-09: it is authorised and implemented in
  # 09_schizophrenia_risk_application under its own gate, using PGC3 European
  # summary statistics against GTEx v11 European brain eQTL/sQTL (AGENTS.md 7.8
  # permits the claim once the analysis is run with ancestry-matched LD). The
  # cross-ancestry EUR-GWAS x AA-meQTL arm stays exploratory and gate-ineligible.
  # See config/schizophrenia.yml:colocalization.
  deferred_analyses: [5_regional_specificity, 7_diagnosis_validation]
  retain_in_main_if:
    - ge_1_credible_risk_locus_with_cpg_meqtl
    - enrichment_toward_higher_predictability_or_interpretable_contrast
    - ge_1_locus_with_expression_or_splicing_coupling
    - caudate_not_explained_solely_by_sample_size
    - internal_or_external_meqtl_replication
    - robust_to_maf_ld_mappability_coverage_annotation
  omit_or_supplement_if:
    - no_credible_risk_variant_meqtl
    - results_vanish_after_technical_adjustment
    - single_problematic_locus_drives_signal
    - no_vmr_connects_to_expression_or_splicing
    - caudate_specificity_disappears_after_downsampling
    - conclusions_rely_only_on_nominal_pvalues
    - adds_nothing_beyond_nonsignificant_sldsc

strong_go_requires:
  - internal_meqtl_burden_validates_predictability
  - survives_adjustment_and_matching
  - ge_1_public_brain_meqtl_resource
  - repeat_repressive_survives_mappability_sensitivity
  - ge_1_cross_region_or_donor_group_insight
  - meqtl_supported_vmrs_show_transcriptional_or_splicing_coupling
  - manuscript_focused_genetic_architecture_narrative
