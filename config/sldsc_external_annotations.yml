# External-annotation S-LDSC benchmark (Module 06 stages 10-13).
#
# PI direction 2026-10-07 (Kynon J.M. Benjamin): run the published neuronal
# CG-DMRs (Rizzardi et al. 2019, Nat Neurosci 22:307, WGBS in NeuN+ nuclei)
# "through exactly the same S-LDSC pipeline, baseline model, reference LD, and
# GWAS summary statistics as the genetic-control VMR annotation", and report
# proportion of SNPs, proportion of h2, enrichment, tau and standardized tau,
# SE and p. Secondary control: DLPFC neuronal H3K27ac (PsychENCODE/CommonMind).
#
# WHY. The module README records, since 2026-09-25, that the accepted VMR
# result is "no detectable enrichment at this footprint" and that the module
# has NO POSITIVE CONTROL, so a null cannot be told from a power null. The
# Rizzardi NeuN+ between-region CG-DMRs are the natural control: a published
# WGBS DMR set with a footprint (0.41% of the genome) close to the VMR
# annotation's (~0.5% of SNPs), reported by its authors to be enriched for
# neuropsychiatric heritability.
#
# WHAT IS IDENTICAL, and is read rather than restated so it cannot drift:
#   - the model, LD reference, weights, frq files, print-snps and ld_wind_cm
#     come from config/partitioned_heritability.yml at ld_reference_arm, the
#     same block the accepted sldsc-AA-*-20260925 runs used;
#   - the GWAS set is the frozen 8-trait family of that file, and the munged
#     .sumstats.gz files are taken from the accepted runs after stage 10 proves
#     the three cells' copies have identical content.
# WHAT DIFFERS, by design: each external annotation enters as ONE binary
# annotation on top of baselineLD v2.2. The VMR model carries two annotations
# (membership + score). So the VMR membership annotation is also refitted
# standalone here (VMR_TESTED_<REGION>), giving a like-for-like row beside each
# external one; the accepted two-annotation rows are reported unchanged beside
# it.
#
# NOT A GATE, NOT A NEW FAMILY. Nothing here revises the accepted Module 06
# decision (sldsc_supports_brain_enrichment = FALSE). Every row carries
# gating = FALSE and nominal p-values; a BH q across the 8 traits is computed
# within each annotation for description only.

pi_locked: true

model_source: config/partitioned_heritability.yml
accepted_vmr_runs:
  caudate: sldsc-AA-caudate-20260925
  dlpfc: sldsc-AA-dlpfc-20260925
  hippocampus: sldsc-AA-hippocampus-20260925

annotations:
  - name: RIZZARDI_CGDMR_NEUNPOS_REGIONS
    role: positive_control_primary
    label: CG-DMRs between brain regions in NeuN+ nuclei (Rizzardi 2019)
    source_url: https://s3.us-east-2.amazonaws.com/brainepigenome/hg19/CG-DMRs.pos.bb
    source_last_modified: "2018-03-13T19:15:47Z"
    source_sha256: 26bb57e164928a8955d8c3cde594efcd9cb2a99eb8925efe616696a56d9c73a6
    expected_n_intervals: 13074
    build: hg19
    bed: inputs/supportfiles/_m/rizzardi2019-cgdmr-neunpos-regions.hg19.bed.gz
  - name: RIZZARDI_CGDMR_NEUNPOS_VS_NEG
    role: positive_control_secondary
    label: CG-DMRs between NeuN+ and NeuN- nuclei (Rizzardi 2019)
    source_url: https://s3.us-east-2.amazonaws.com/brainepigenome/hg19/CG-DMRs.pos_vs_neg.bb
    source_last_modified: "2018-03-13T19:15:46Z"
    source_sha256: 888d4ce63eb86e60e181d81a793426486cd21496494aa26ed19bc5313f13f49a
    expected_n_intervals: 100875
    build: hg19
    bed: inputs/supportfiles/_m/rizzardi2019-cgdmr-neunpos-vs-neg.hg19.bed.gz
  # Secondary control named by the PI. Girdhar et al. 2018 (Nat Neurosci
  # 21:1126) NeuN+ H3K27ac peaks are deposited at Synapse syn9998643 under NRGR
  # CONTROLLED ACCESS, and no copy exists on Quest (searched 2026-10-07). Stage 10
  # skips an annotation whose status is not `ready` and records why, so the run
  # cannot quietly present itself as covering it.
  - name: PSYCHENCODE_NEUNPOS_H3K27AC_DLPFC
    role: secondary_control
    label: DLPFC NeuN+ H3K27ac peaks (Girdhar 2018, PsychENCODE/CMC)
    source_url: https://www.synapse.org/#!Synapse:syn9998643
    status: pending_access
    build: hg19
    bed: null

# The standalone refit of each region's VMR membership annotation. Built from
# the accepted run's annotation/annotation-hg19.bed (every lifted, eligible VMR
# carries membership 1), so it is the same SNP set as VMR_TESTED there.
vmr_membership_comparators: true

# Standardized tau (Gazal et al. 2017): tau* = tau * sd(a) * M / h2g, with sd(a)
# and M over reference SNPs with MAF >= 5% in the frq files, and h2g the total
# observed-scale h2 from the same regression's log.
standardized_tau_min_maf: 0.05

# Descriptive BH within each annotation across the 8 traits. Not a family any
# decision reads.
descriptive_fdr_method: BH
