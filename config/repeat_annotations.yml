# Repeat and repressive-chromatin annotations (04_repeat_repressive_architecture).
#
# PI-locked 2026-08-23 by Kynon J.M. Benjamin.
# Amended 2026-08-28: added the H3K27me3/bivalent specificity control and the
# accessible-chromatin contrast. Both are PRESPECIFIED CONTROLS OUTSIDE the BH
# family, which remains the three primary repressive fraction outcomes, so this
# amendment does not change any q-value already reported.
#
# Amended 2026-09-02: the specificity control was re-specified as SIGN-AWARE and
# bivalent_frac was demoted to descriptive. Rationale, recorded before any
# full-n result was seen (only a 2000-VMR smoke had run):
#   (a) A Polycomb NULL was the wrong prior. H3K9me3 and H3K27me3 occupy broadly
#       anti-correlated compartments -- constitutive heterochromatin in gene-poor,
#       repeat-rich, late-replicating sequence; Polycomb at CpG islands and
#       developmental promoters. Independently, the local SNP contribution score
#       is depleted at CGI/Polycomb loci, which are hypomethylated, low-variance
#       and constraint-depleted of common large-effect mQTLs. Both effects push
#       the Polycomb estimate NEGATIVE under the alternative hypothesis, so a
#       two-sided null could not be satisfied by data consistent with our claim.
#   (b) A negative Polycomb estimate opposite a positive primary is evidence FOR
#       constitutive specificity, not against it. The previous |estimate|
#       comparison was sign-blind and inverted that inference.
#   (c) bivalent_frac is drawn from the SAME closed ChromHMM 15-state partition
#       as quiescent (15_Quies). Fractions in a closed partition sum to one, so
#       quiescent enrichment mechanically forces bivalent depletion. That is
#       arithmetic, not evidence, and it cannot be null under the alternative.
#       h3k27me3 is an independent gappedPeak call and is NOT subject to this.
# The BH family is untouched, so no reported q changes.
#
# Amended 2026-09-02 (second amendment of this date): the ADJUSTMENT SET was
# re-specified, and the exclude_snp_proximal sensitivity was retired from the
# gating conjunction. This amendment DOES change the primary fits, and the
# decomposition that motivated it was seen first, so the reasoning is recorded
# in full rather than summarized.
#
# The trigger: run rra-AA-*-20260902 returned H3K9me3 0/3 regions and quiescent
# 0/3, against v1 (meqtl-validation/02_vmr_meqtl_burden), which reported both.
# A nested adjustment ladder refit on the sealed feature table shows the v1
# signal is FULLY REPRODUCIBLE in v2 data at the v1-like rung (caudate H3K9me3
# 0.434, quiescent 0.714, LINE/L1 0.746 log-odds per SD; DLPFC H3K9me3 0.381,
# p=1.5e-14). It does not die from re-analysis, better annotation or the
# liftover. It dies from covariates, and almost all of the attenuation is
# carried by two rungs. So neither version was right: v1 under-adjusted (it
# carried NO technical covariates at all), v2 over-adjusted on mediators.
#
# The judgement applied to each covariate is: is it a COMMON CAUSE of both
# local genetic control of methylation and repressive-compartment residence
# (adjust), or is it on the causal path / partly constitutive of the outcome
# (do not adjust)?
#
#   REMOVED as mediators or as constitutive of the exposure's definition:
#     methylation_variance -- this is the DEFINING property of a VMR and sits
#       directly on the path from local genetic variation to methylation.
#       Conditioning on it removes the exposure's effect by construction.
#     mean_methylation -- same path, and the quiescent compartment IS the
#       hypermethylated compartment, so this is near-constitutive of one of
#       the three family outcomes.
#     wgbs_coverage -- retained in the same block because coverage enters the
#       variance estimate that defines the phenotype; adjusting for it is
#       adjusting for a component of the exposure, not for a common cause.
#     broad_genomic_annotation -- genic/intergenic is partly constitutive of
#       "quiescent, gene-poor, late-replicating". Adjusting for it asks
#       whether, within intergenic sequence, intergenic-ness is associated.
#
#   RETAINED as genuine common causes or as technical confounders:
#     vmr_length, cpg_count, cpg_density, gc_content -- sequence composition
#       drives both mQTL discoverability and compartment membership.
#     tested_snp_count -- discovery opportunity for the exposure.
#     snp_proximity, mappability, segdup_overlap, problematic_region_overlap --
#       the technical block. v1 had none of these, which is its own defect;
#       these are protective and stay.
#
#   MOVED to a sensitivity (see sensitivities.adjust_cell_composition):
#     cell_composition_pcs -- defensible as a common cause, but it entered at
#       the same rung as broad_genomic_annotation and its status is arguable.
#       Rather than decide it silently in the primary, the primary omits it and
#       a dedicated arm refits every model WITH cell_composition_r2 added. The
#       existing low_cell_composition subset arm is unchanged and independent.
#
# The four removed covariates are NOT dropped from the feature table. They move
# to `descriptive_covariates` below and are still constructed and still fail
# loudly if they cannot be built, so the ladder, the QC tables and the new arm
# all keep their columns. Only the model formula narrows.
#
# RETIRED SENSITIVITY -- exclude_snp_proximal. Two independent reasons, neither
# of which depends on any result:
#   (a) REDUNDANT. The identical BED already enters every model as the
#       covariate `snp_proximity` (realized as snp_proximal_frac). The arm
#       conditioned on a variable the primary already adjusts for.
#   (b) BIASING, and not a faithful realization of this key. The key names a
#       CpG-LEVEL exclusion. snp_proximal_frac is a BASE-PAIR overlap fraction
#       of the VMR span with the +/-150bp windows, so `== 0` selects short VMRs
#       mechanically -- and every outcome here is itself a length-dependent
#       overlap fraction. It kept 17.6-18.6% of loci, biased to shorter, more
#       accessible, less repeat-rich spans (hippocampus: kept 583bp / 13.5
#       CpGs / LINE-L1 0.047 vs dropped 768bp / 15.3 CpGs / LINE-L1 0.069).
#       Common-SNP density is itself elevated in repeat-rich late-replicating
#       sequence, so the arm partly conditioned on "not heterochromatin" while
#       testing for heterochromatin.
# Because survives() is a strict conjunction, this one arm decided verdicts: it
# blocked accessible-chromatin depletion in all three regions and took LINE/L1
# from 2/2 to 1/2. It is retired as REDUNDANT -- argument (a), which is
# independent of the data -- and is still fitted and reported descriptively in
# results/descriptive-snp-proximal.tsv. This change favours the hypothesis;
# that is stated here rather than left for a reader to notice.
#
# A faithful CpG-level exclusion is NOT realizable in module 04. The predictor
# descends from the module 02 VMR phenotype, which averages over ALL CpGs in
# the span (01_vmr_catalog/_h/02_summarize.R). It would require re-running
# 01 summarize -> 02 -> 04. Scoped and documented in the module README; not
# executed.
#
# The BH family is untouched: same three outcomes, same primary analysis set,
# same primary predictor.

# The primary predictor is the standardized continuous within-cell local SNP
# contribution score among eligible loci; r2_pred_oof is secondary. Overlap
# alone never implies activity, expression, or retrotransposition.

pi_locked: true

genome_build: hg38

repeatmasker:
  version: hg38_rmsk_ucsc          # UCSC RepeatMasker track, hg38, project asset
  bed: inputs/supportfiles/_m/repeat-masker-hg38.gz
  line_l1_bed: inputs/supportfiles/_m/repeat-masker.LINE_L1.hg38.bed.gz
  # High-value extension (AGENTS.md 7.4) -- DEFERRED, not implemented 2026-08-23.
  l1_subfamily_definitions: null
  retrotransposition_competent_list: null

chromatin:
  # NIH Roadmap consolidated epigenomes, already on Quest. These tracks are
  # hg19, so 04 lifts hg38 VMRs DOWN to hg19 before overlap (see liftover
  # below) rather than lifting the tracks up: the hg38ToHg19 chain is the one
  # asset the project already has, and it is the direction the legacy analysis
  # used, which keeps the old-vs-new comparison honest.
  source: roadmap_consolidated
  build: hg19
  roadmap_eid:
    caudate: E068                  # Brain Anterior Caudate
    dlpfc: E073                    # Brain Dorsolateral Prefrontal Cortex
    hippocampus: E071              # Brain Hippocampus Middle
  h3k9me3:
    dir: /projects/b1213/resources/EpigenomeRoadmap/egg2.wustl.edu/roadmap/data/byFileType/peaks/consolidated/gappedPeak
    template: "{eid}-H3K9me3.gappedPeak.gz"
    # gappedPeak is BED12-like and rtracklayer::import() will not parse it as
    # BED. Read columns 1-3 (the peak span) with fread, as the legacy reader
    # did; the block structure in columns 10-12 is not used.
    columns: [1, 2, 3]
  quiescent:
    dir: /projects/b1213/resources/EpigenomeRoadmap/hmm/15core
    template: "{eid}_15_coreMarks_mnemonics.bed.gz"
    states: ["15_Quies"]
  # --- Specificity control (outside the BH family) -----------------------
  # H3K9me3 and 15_Quies cannot separate constitutive heterochromatin from
  # Polycomb repression generally. H3K27me3 marks the Polycomb arm; the
  # bivalent ChromHMM states mark poised promoters/enhancers, which are
  # repressed but developmentally licensed rather than constitutively silent.
  # Specificity is a CONTRAST, not two marginal fits. What defeats the
  # constitutive claim is a Polycomb estimate of the SAME SIGN and comparable
  # magnitude to the primary -- that is repression generally. An opposite-signed
  # Polycomb estimate supports constitutive specificity (see 2026-09-02 above).
  # bivalent is retained as DESCRIPTIVE only: it shares the closed ChromHMM
  # partition with quiescent, so its sign is not independent evidence.
  h3k27me3:
    dir: /projects/b1213/resources/EpigenomeRoadmap/egg2.wustl.edu/roadmap/data/byFileType/peaks/consolidated/gappedPeak
    template: "{eid}-H3K27me3.gappedPeak.gz"
    columns: [1, 2, 3]
  bivalent:
    dir: /projects/b1213/resources/EpigenomeRoadmap/hmm/15core
    template: "{eid}_15_coreMarks_mnemonics.bed.gz"
    states: ["10_TssBiv", "11_BivFlnk", "12_EnhBiv"]

  # --- Accessible contrast (outside the BH family) -----------------------
  # AGENTS.md 2.1 claims local-genetic-control loci CONCENTRATE in repressive
  # chromatin. Enrichment in repressive marks alone is also consistent with VMRs
  # sitting in gene deserts, where every repressive track is wide. The
  # complementary arm is what distinguishes the two: concentration requires
  # DEPLETION in accessible chromatin, and the expectation is therefore
  # directional and one-sided (see interpretation.accessible_contrast).
  #
  # Built from the same Roadmap EIDs, the same build, and the same liftover as
  # the repressive tracks, so no asset, coordinate system, or peak-calling
  # difference can drive the contrast. ChromHMM active states are the primary
  # form; the H3K27ac gappedPeak is the peak-based companion, reported beside
  # it, not corrected across.
  accessible:
    dir: /projects/b1213/resources/EpigenomeRoadmap/hmm/15core
    template: "{eid}_15_coreMarks_mnemonics.bed.gz"
    states: ["1_TssA", "2_TssAFlnk", "6_EnhG", "7_Enh"]
  h3k27ac:
    dir: /projects/b1213/resources/EpigenomeRoadmap/egg2.wustl.edu/roadmap/data/byFileType/peaks/consolidated/gappedPeak
    template: "{eid}-H3K27ac.gappedPeak.gz"
    columns: [1, 2, 3]

  liftover:
    chain: inputs/supportfiles/_m/hg38ToHg19.over.chain
    direction: hg38_to_hg19
    # A VMR that fails to lift, or lifts to more than one interval, is dropped
    # and REPORTED in liftover-report.tsv. Never silently coerced to its first
    # interval.
    drop_multi_mapping: true

# Required adjustment / matching covariates (AGENTS.md 7.4). Every one of these
# is constructed by 01_build_features.R, which FAILS rather than fitting a
# thinner model if any cannot be built.
covariates:
  - vmr_length
  - cpg_count
  - cpg_density
  - gc_content
  - tested_snp_count
  - snp_proximity
  - mappability
  - segdup_overlap
  - problematic_region_overlap

# Built and completeness-checked exactly like `covariates`, but NOT in the
# primary model formula. See the 2026-09-02 adjustment-set amendment above for
# why each one is a mediator, constitutive of an outcome, or moved to an arm.
# They remain available to the sensitivity arms and to post-hoc QC.
descriptive_covariates:
  - mean_methylation
  - methylation_variance
  - wgbs_coverage
  - broad_genomic_annotation
  - cell_composition_pcs

covariate_sources:
  gc_content: BSgenome.Hsapiens.UCSC.hg38
  wgbs_coverage: module_01_cpg_stats_rda      # 00_shared/wgbs.R::load_bsobj
  snp_proximity: inputs/supportfiles/_m/common_snp_windows_pm150bp.hg38.bed.gz
  problematic_region_overlap: inputs/supportfiles/_m/hg38-blacklist.v2.bed.gz
  broad_genomic_annotation: gencode_basic     # genic/exonic/promoter/intergenic
  cell_composition_pcs: config/cell_deconvolution.yml
  n_cell_composition_pcs: 3

# Locked sensitivities. Enrichment that does not survive these is not reported
# as a result (AGENTS.md 14: stop if repeat enrichment disappears).
sensitivities:
  high_mappability:
    umap_k24_bw: inputs/supportfiles/_m/k24.Umap.MultiTrackMappability.bw
    min_mappability: 0.9
  exclude_segdups:
    bed: inputs/supportfiles/_m/genomicSuperDups.hg38.bed.gz
  exclude_snp_proximal_cpgs:
    bed: inputs/supportfiles/_m/common_snp_windows_pm150bp.hg38.bed.gz
    # RETIRED from the gating conjunction 2026-09-02 as redundant with the
    # `snp_proximity` covariate. Still fitted, reported non-gating in
    # results/descriptive-snp-proximal.tsv. See the header amendment.
    descriptive_only: true
  # Refits every model with cell_composition_r2 ADDED to the adjustment set.
  # An adjustment-variant arm, not a subset arm.
  adjust_cell_composition: true
  cell_composition_rna_music: true
  cell_composition_dnam_scmd: true    # caudate only, when the integration gate passes
  matched_high_low_comparison: true   # secondary evidence only

# Primary model. The outcome is the per-VMR annotation overlap FRACTION, so the
# link is quasibinomial logit with donor-independent sandwich standard errors
# (each VMR is one observation; the overdispersion is across loci). The binary
# any-overlap call is retained as the legacy-comparable secondary form.
primary_model:
  family: quasibinomial
  link: logit
  outcome: overlap_fraction
  secondary_outcome: overlap_any
  predictor: local_snp_contribution_score_z
  secondary_predictor: r2_pred_oof_z
  vcov: HC3
  adjust_for: all_declared_covariates

# Multiple testing. Stated here rather than left implicit in the script, because
# the family is the thing that must not drift between runs.
multiple_testing:
  method: BH
  # THE FAMILY. Three hypotheses, primary analysis set, primary predictor only.
  # The `_any` forms are the same hypotheses on a second scale (see
  # primary_model.secondary_outcome) and are NOT separate members; correcting
  # over both scales inflates the family to six for three questions and, because
  # the two scales are strongly correlated, is conservative without being
  # principled. Sensitivities are re-fits of a family member, not new members.
  family:
    - h3k9me3_frac
    - quiescent_frac
    - line_l1_frac
  # Prespecified controls. Reported with raw p and an explicit directional
  # expectation; never added to `family`, so the family is fixed for the life of
  # the project and adding a control never revises a reported q.
  outside_family:
    h3k27me3_frac:   {role: specificity_control,    expected_direction: null}
    # Demoted 2026-09-02: closed-partition dependence with quiescent_frac.
    # Reported, never gated on.
    bivalent_frac:   {role: descriptive,            expected_direction: null}
    accessible_frac: {role: complementary_contrast, expected_direction: negative}
    h3k27ac_frac:    {role: complementary_contrast, expected_direction: negative}
  # The gate reads q for family members and p for controls. Making this explicit
  # because 03_apply_gates.R previously tested raw p for everything, silently
  # ignoring the correction it had just computed.
  gate_statistic:
    family: q
    outside_family: p

# Interpretation gates (AGENTS.md 7.4)
interpretation:
  # H3K9me3 / quiescent may be called "shared across regions" only if direction
  # AND inference survive locked sensitivities in ALL THREE regions.
  shared_requires_regions: 3
  # LINE/L1 may be called multi-region if it survives in at least two. If it
  # survives only in caudate, it is presented as caudate-specific.
  line_l1_multiregion_requires: 2
  # Secondary predictor (r2_pred_oof_z): DESCRIPTIVE ONLY, never corroboration.
  # Amendment 2026-09-02. `line_l1_frac` is a member of the BH family and
  # `r2_pred_oof` is the Module 03 out-of-fold predictability of the same loci.
  # Module 03's own step-6 QC established that LINE/L1 content is one of the
  # strongest correlates of predictability (monotone across r2 bins in all three
  # regions; adjusted OR 3.29, p=5e-17). Regressing LINE/L1 overlap on
  # predictability is therefore close to regressing a variable on a function of
  # itself: a positive coefficient is expected under the null that local genetic
  # architecture has nothing to do with it. The cell is retained because
  # suppressing it would be selective reporting, but it may never be written as
  # a second line of evidence for a family claim.
  secondary_predictor_role: descriptive
  secondary_predictor_circular_outcomes:
    - line_l1_frac
  # A DLPFC reversal or null after the high-mappability restriction is never
  # hidden.
  report_dlpfc_reversal: true
  alpha: 0.05
  # The concentration claim (AGENTS.md 2.1) needs both arms. Enrichment in a
  # repressive outcome without depletion in accessible chromatin may be written
  # only as "enriched in <track>", never as "concentrated in repressive
  # chromatin".
  accessible_contrast:
    required_for_concentration_claim: true
    expected_direction: negative
    one_sided: true
    regions_required: 3
  # The constitutive claim fails only when Polycomb behaves like the primary:
  # SAME sign AND comparable magnitude. Compared on the standardized estimate,
  # not on p, so a larger sample on one track cannot decide it. An
  # opposite-signed Polycomb estimate never blocks the claim.
  specificity_control:
    constitutive_claim_requires_stronger_than_polycomb: true
    sign_aware: true
    # Only these outcomes gate the constitutive noun. bivalent_frac is excluded
    # by the 2026-09-02 amendment.
    polycomb_outcomes: ["h3k27me3_frac"]
