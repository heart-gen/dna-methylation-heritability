# Paths for CpG meQTL strengthening analyses
# All relative paths are relative to project_root unless absolute.

project_root: /projects/b1213/users/kynon/projects/dna-methylation-heritability
staff_project_root: /projects/b1213/users/alexis/projects/dna-methylation-heritability
eqtl_scaffold_root: /projects/b1213/users/kynon/projects/sex_context_brain/eqtl_analysis
eqtl_conda_env: eqtl

regions:
  - caudate
  - dlpfc
  - hippocampus

primary_population: AA
expanded_populations:
  - AA
  - EA

phenotype_table: sample_summary/_m/phenotype_data.tsv

region_phenotype_tables:
  caudate: inputs/wgbs-data/combined/_m/caudate_phenotypes.csv
  dlpfc: inputs/wgbs-data/combined/_m/dlpfc_phenotypes.csv
  hippocampus: inputs/wgbs-data/combined/_m/hippocampus_phenotypes.csv

# AA discovery VMRs (primary Phase 1). all_individuals VMRs available for EA/expanded.
vmr_bed_template: vmr-analysis/{region}/_m/vmr.bed
vmr_bed_aa_template: vmr-analysis/{region}/_m/vmr.bed
vmr_bed_all_individuals_template: vmr-analysis/all_individuals/{region}/_m/vmr.bed

# legacy_invalid_for_prediction_accuracy
# These templates serve existing meqtl-validation consumers only. They carry
# `r_squared_cv`, which is an IN-SAMPLE fit (defect E1) and is invalid as a
# prediction-accuracy metric. No v2 module may read these keys; the v2
# replacement is 03_local_snp_prediction (not yet implemented).
# The paths are also stale: the on-disk tree is local-snp-prediction/, not
# heritability/elastic_net_model/.
local_predictability_summary_template: heritability/elastic_net_model/all_individuals/{region}/_m/{region}_summary_elastic-net_AA.tsv
local_predictability_ea_template: heritability/elastic_net_model/all_individuals/{region}/_m/{region}_summary_elastic-net_EA.tsv

vmr_annotation_template: heritability/elastic_net_model/all_individuals/tissue_comparison/annotation/_m/{region}_vmr_annotations_hg38.tsv
vmr_annotation_wide_template: heritability/elastic_net_model/all_individuals/tissue_comparison/annotation/_m/{region}_vmr_annotations_hg38_wide.tsv

# Keep RNA and DNAm composition tracks explicit. The legacy alias remains for
# scripts that predate DNAm deconvolution and always means RNA MuSiC.
cell_proportions_template: inputs/cell_proportions/_m/music-proportions-{region}.tsv
rna_cell_proportions_template: inputs/cell_proportions/_m/music-proportions-{region}.tsv
dnam_cell_proportions_template: inputs/cell_proportions/_m/dnam-scmd-proportions-{region}.tsv
dnam_cell_validation_template: inputs/cell_proportions/_m/dnam-scmd-validation-{region}.tsv

genotype:
  AA:
    pgen: inputs/genotypes/TOPMed_LIBD.AA.pgen
    psam: inputs/genotypes/TOPMed_LIBD.AA.psam
    pvar: inputs/genotypes/TOPMed_LIBD.AA.pvar
    eigenvec: inputs/genotypes/TOPMed_LIBD.AA.eigenvec
    eigenval: inputs/genotypes/TOPMed_LIBD.AA.eigenval
  # EA and expanded AA+EA use the multi-ancestry TOPMed pfile (filter samples downstream)
  all_individuals:
    pgen: inputs/genotypes/all_individuals/TOPMed_LIBD.pgen
    psam: inputs/genotypes/all_individuals/TOPMed_LIBD.psam
    pvar: inputs/genotypes/all_individuals/TOPMed_LIBD.pvar
    eigenvec: inputs/genotypes/all_individuals/TOPMed_LIBD.eigenvec
    eigenval: inputs/genotypes/all_individuals/TOPMed_LIBD.eigenval
  EA:
    pgen: inputs/genotypes/all_individuals/TOPMed_LIBD.pgen
    psam: inputs/genotypes/all_individuals/TOPMed_LIBD.psam
    pvar: inputs/genotypes/all_individuals/TOPMed_LIBD.pvar
    eigenvec: inputs/genotypes/all_individuals/TOPMed_LIBD.eigenvec
    eigenval: inputs/genotypes/all_individuals/TOPMed_LIBD.eigenval
  all_individuals_dir: inputs/genotypes/all_individuals

# Non-residualized CpG matrices live in the staff (Alexis) repo.
# Primary AA discovery uses the AA-only tree; EA / expanded use all_individuals.
cpg_methylation_root: /projects/b1213/users/alexis/projects/dna-methylation-heritability
cpg_methylation_matrix_template: vmr-analysis/{region}/_m/cpg/chr_{chrom}/cpg_meth.phen
cpg_methylation_matrix_aa_template: vmr-analysis/{region}/_m/cpg/chr_{chrom}/cpg_meth.phen
cpg_methylation_matrix_all_individuals_template: vmr-analysis/all_individuals/{region}/_m/cpg/chr_{chrom}/cpg_meth.phen
cpg_methylation_matrix_ea_template: vmr-analysis/all_individuals/{region}/_m/cpg/chr_{chrom}/cpg_meth.phen
residualized_cpg_methylation_matrix_template: vmr-analysis/{region}/_m/cpg/chr_{chrom}/res_cpg_meth.phen
residualized_cpg_methylation_matrix_all_individuals_template: vmr-analysis/all_individuals/{region}/_m/cpg/chr_{chrom}/res_cpg_meth.phen
cpg_samples_aa_template: vmr-analysis/{region}/_m/samples.txt
cpg_samples_all_individuals_template: vmr-analysis/all_individuals/{region}/_m/samples.txt

# legacy_invalid_for_prediction_accuracy (see note above; stale path)
regulatory_context_root: heritability/elastic_net_model/all_individuals/tissue_comparison/regulatory_context/_m

# ---------------------------------------------------------------------------
# v2 revision keys (AJHG revision, root-level numbered modules)
# ---------------------------------------------------------------------------

# Module roots
v2_shared_root: 00_shared
v2_vmr_root: 01_vmr_catalog
v2_variance_root: 02_local_genetic_variance

# Raw WGBS. One BSobj per region per chromosome.
wgbs_bsobj_template: inputs/wgbs-data/{region}/_m/{region}_chr{chrom}_BSobj.rda

# Genome-wide HDF5 backing store for the per-chromosome BSobj views above.
# V14: the DLPFC BSobj files have a stale absolute path baked in
# (dlpfc_assays.h5; the file on disk is assays.h5). 00_shared/wgbs.R repoints
# every BSobj at these paths, so this key -- not the .rda -- is authoritative.
wgbs_hdf5_assays:
  caudate: /gpfs/projects/b1213/resources/libd_data/wgbs/caudate/raw/CpGassays.h5
  dlpfc: /gpfs/projects/b1213/resources/libd_data/wgbs/new-data/dlpfc/_m/combined_hdf5/assays.h5
  hippocampus: /gpfs/projects/b1213/resources/libd_data/wgbs/new-data/hippocampus/_m/combined_hdf5/assays.h5

# C->T SNP masks. Autosomes only -- there is no chrX/chrY file, which is why
# thresholds.yml keeps sex chromosomes out of the primary catalog (V4).
ct_snp_dir: /projects/b1213/resources/libd_data/wgbs/DEM2/snps_CT
ct_snp_template: /projects/b1213/resources/libd_data/wgbs/DEM2/snps_CT/chr{chrom}

# Per-chromosome lengths. V10: legacy step_5.sh looked up chr1's length once and
# used it as the bound for every chromosome; v2 looks up each chromosome.
chrom_sizes: /projects/b1213/resources/genomes/human/gencode-v47/fasta/chromosome_sizes.txt

ancestry_file: inputs/genetic-ancestry/structure.out_ancestry_proportion_raceDemo_compare

# v2 run outputs. Immutable, gitignored.
v2_run_template: "{module_root}/_m/runs/{run_id}"

# Conda environments (never the module system)
v2_env_root: /projects/p32505/opt/envs
v2_env_r: /projects/p32505/opt/envs/epigenomics
v2_env_calibration: /projects/p32505/opt/envs/calibrated-local-h2
v2_plink2: /projects/p32505/opt/bin/plink2

data_dictionary:
  script_dir: inputs/data_dictionary/_h
  output_dir: inputs/data_dictionary/_m

meqtl_validation_root: meqtl-validation
config_dir: config

# Phase 7 schizophrenia-risk application (prespecified; not methylation-defined)
schizophrenia_gwas:
  pgc3_loci_hg38: /projects/b1213/resources/gwas/pgc3/fine_mapped_loci/to_hg38/_m/gwas_loci_hg38.tsv
  pgc3_index_snp_xls: /projects/b1213/resources/gwas/pgc3/fine_mapped_loci/_m/primaryGWAS_indexSNP.xls
  pgc3_index_snp_tsv: meqtl-validation/08_schizophrenia_risk_application/_m/raw/pgc3_primary_gwas_index_snps.tsv
  module_root: meqtl-validation/08_schizophrenia_risk_application

support_files:
  repeat_masker: inputs/supportfiles/_m/repeat-masker-hg38.gz
  repeat_masker_line_l1: inputs/supportfiles/_m/repeat-masker.LINE_L1.hg38.bed.gz
  hg38_to_hg19_chain: inputs/supportfiles/_m/hg38ToHg19.over.chain
  hg19_to_hg38_chain: meqtl-validation/03_external_meqtl_validation/_m/support/hg19ToHg38.over.chain.gz
  blacklist_hg38: inputs/supportfiles/_m/hg38-blacklist.v2.bed.gz
  segmental_duplications_hg38: inputs/supportfiles/_m/genomicSuperDups.hg38.bed.gz
  umap_k24_bw: inputs/supportfiles/_m/k24.Umap.MultiTrackMappability.bw
  ct_snps_at_cpg: inputs/supportfiles/_m/libd_CT_snps_at_cpg.hg38.bed.gz
  common_snp_proximity_windows: inputs/supportfiles/_m/common_snp_windows_pm150bp.hg38.bed.gz
  annotation_asset_manifest: inputs/supportfiles/_m/annotation_asset_manifest.tsv

# Per-CpG coverage is extracted from staff-repo stats.rda BSobj (getCoverage)
cpg_coverage:
  source: stats.rda_BSobj
  staff_stats_template: vmr-analysis/{region}/_m/cpg/chr_{chrom}/stats.rda
  staff_stats_aa_template: vmr-analysis/{region}/_m/cpg/chr_{chrom}/stats.rda
  staff_stats_all_individuals_template: vmr-analysis/all_individuals/{region}/_m/cpg/chr_{chrom}/stats.rda
  min_coverage: 5
  output_template: meqtl-validation/01_cpg_meqtl_mapping/{region}/_m/prepared/cpg_coverage.chr{chrom}.tsv
