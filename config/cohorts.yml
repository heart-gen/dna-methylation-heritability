# v2 cohort definitions for the AJHG revision.
#
# Two analysis arms, run through ONE parameterized codepath (AGENTS.md 5.3:
# "Do not duplicate region- or cohort-specific copies of the same code").
#
#   AA              Black American donors only          -> PRIMARY
#   all_individuals Black + white American donors       -> SENSITIVITY
#
# Prose labels: AA = "Black American", EA = "non-Hispanic white American".
# Never write "African American". Legacy code uses BA==AA and WA==EA.

pi_locked: true

primary: AA

arms:
  - AA
  - all_individuals

regions:
  - caudate
  - dlpfc
  - hippocampus

# ---------------------------------------------------------------------------
# Estimation cells (donor-group axis, PI 2026-09-06; AGENTS.md 7.7)
# ---------------------------------------------------------------------------
# An ARM is a discovery population: it decides which donors VMRs are called in.
# An ESTIMATION CELL is a donor subset that the SNP-consuming stages (Modules
# 02 and 03) are fit in, on a locus set discovered somewhere else.
#
# The biologically correct donor-group design is: discover VMRs ONCE in the
# pooled sample, then estimate local genetic control separately within Black
# American and within non-Hispanic white American donors on that one fixed
# locus set. Discovery is shared, so the two groups are disjoint sets evaluated
# on identical loci; MAF, LD and effect estimation are within-group.
#
# This mirrors v1 exactly. v1 called VMRs in vmr-analysis/all_individuals/, then
# wrote samples-AA.txt / samples-EA.txt (01.get_cpg_stats.R:112-133) and ran
# plink2 twice per VMR window with --keep (step_5.sh:95-122), then modeled each
# group separately (local-snp-prediction/all_individuals/.../01.elastic-net.R,
# population-parameterized) and recombined by an inner join on locus
# coordinates with _AA / _EA suffixes (venn_diagram/_h/02.compare_cohort.R:53-62).
#
# EA is deliberately NOT an arm. Making it one would let Module 01 discover VMRs
# in EA donors only, which is the set-versus-superset design AGENTS.md 7.7
# forbids: "Do not contrast AA against all_individuals: those are nested, and a
# set-versus-superset comparison is not a donor-group contrast."
#
# Cell token convention: "{catalog_cohort}.{estimation_group}". A BARE arm token
# (AA, all_individuals) parses as a cell whose estimation group equals its
# cohort, which is what every pre-2026-09-10 run is. That is what lets run IDs,
# README acceptance tables, gates.R and every downstream manifest field keep
# working with no schema change -- the cell token goes where the cohort token
# went.
#
# The donor-group contrast is all_individuals.AA vs all_individuals.EA, and only
# that pair.

estimation_cells:

  all_individuals.AA:
    catalog_cohort: all_individuals
    estimation_group: AA
    cell_kind: race_partition
    race_filter: [AA]
    label: Black American donors, pooled-discovery loci

  all_individuals.EA:
    catalog_cohort: all_individuals
    estimation_group: EA
    cell_kind: race_partition
    race_filter: [EA]
    label: non-Hispanic white American donors, pooled-discovery loci

  # ------------------------------------------------------------------------
  # Tier-3 donor-count sensitivity cells (08_region_donor_generalization).
  # PI-directed 2026-09-18; scope in config/region_donor_generalization.yml.
  #
  # These are NOT a donor-group split and carry no ancestry interpretation.
  # They exist to test one attribution Module 03 made and never verified: that
  # caudate's prediction excess follows from its donor count (153) rather than
  # from the region. Each cell is the AA caudate donor set drawn down to 118 --
  # the DLPFC count, which is what makes the comparison matched rather than an
  # arbitrary decimation.
  #
  # `cell_kind: donor_subsample` is the second cell kind. A race_partition cell
  # is defined by a label and its siblings must partition the pooled set; a
  # donor_subsample cell is defined by a SEED and deliberately does neither. It
  # overlaps its own replicates, and it is a proper subset of exactly one source
  # cell. 01b_estimation_cells branches on the kind and applies the matching
  # proof; the partition proof is not applied to these and must not be.
  #
  # Three replicates because a single draw would put the conclusion at the mercy
  # of one partition of 153 donors. Each is its own sealed 01b + 02 + 03 chain
  # under its own immutable cell token, so a replicate cannot be silently
  # reinterpreted after the fact.
  #
  # Why real cells and not a row subset of the accepted caudate run: the
  # endpoint is a WITHIN-CELL midrank percentile, so it does not survive row
  # subsetting, and 00_shared/locus_io.R computes the MAF and missingness
  # filters over every donor present in the locus BED (lines 185-189, before the
  # donor merge at 224). Reusing the 153-donor BEDs would select SNPs using 35
  # donors that are not in the estimation set. The subsets must be extracted.
  AA.n118r1:
    catalog_cohort: AA
    estimation_group: n118r1
    cell_kind: donor_subsample
    donor_subsample:
      source_cell: AA
      region: caudate
      target_n: 118
      replicate: 1
      seed: 20260918
      # Balance against the SOURCE cell, not against DLPFC: the question is
      # whether n alone accounts for the excess, so everything except n should
      # look like the full caudate set. Column names are the phenotype table's
      # own (inputs/phenotypes/_m/phenotypes-all.tsv).
      balance_on: [agedeath, sex, primarydx]
      balance_smd_max: 0.1
      max_draws: 10000
    label: Black American caudate donors drawn to n=118, replicate 1

  AA.n118r2:
    catalog_cohort: AA
    estimation_group: n118r2
    cell_kind: donor_subsample
    donor_subsample:
      source_cell: AA
      region: caudate
      target_n: 118
      replicate: 2
      seed: 20260919
      balance_on: [agedeath, sex, primarydx]
      balance_smd_max: 0.1
      max_draws: 10000
    label: Black American caudate donors drawn to n=118, replicate 2

  AA.n118r3:
    catalog_cohort: AA
    estimation_group: n118r3
    cell_kind: donor_subsample
    donor_subsample:
      source_cell: AA
      region: caudate
      target_n: 118
      replicate: 3
      seed: 20260920
      balance_on: [agedeath, sex, primarydx]
      balance_smd_max: 0.1
      max_draws: 10000
    label: Black American caudate donors drawn to n=118, replicate 3

arm_definitions:

  AA:
    label: Black American
    # The AA-only phenotype table is a pre-filtered convenience file. We read the
    # full table and apply the race filter ourselves so both arms share one
    # codepath and the filter is auditable.
    phenotype_table: inputs/phenotypes/_m/phenotypes-all.tsv
    race_filter: [AA]
    psam: inputs/genotypes/TOPMed_LIBD.AA.psam
    # V8: this .psam is HEADERLESS. read_psam() in 00_shared/identity.R handles
    # both forms; do not pass header=TRUE.
    psam_has_header: false
    pgen_prefix: inputs/genotypes/TOPMed_LIBD.AA
    covar_prefix: TOPMed_LIBD.AA

  all_individuals:
    label: Black and white American
    phenotype_table: inputs/phenotypes/_m/phenotypes-all.tsv
    race_filter: [AA, EA]
    psam: inputs/genotypes/all_individuals/TOPMed_LIBD.psam
    psam_has_header: true
    pgen_prefix: inputs/genotypes/all_individuals/TOPMed_LIBD
    covar_prefix: TOPMed_LIBD

# Donor counts.
#
# phenotype_n is what the phenotype table yields after agedeath >= 17 and the
# region + race filters. It is a CEILING, not the design count: the analysis set
# is the intersection of (phenotype table) x (BSobj colData$brnum) x (psam), so
# the observed n will be <= these numbers.
#
# design_n is null until the first accepted 01_vmr_catalog run reports observed
# counts and the PI signs off. While null, assert_expected_n() records the
# observed count and warns; once set, a mismatch is a hard stop.
#
# For reference, the legacy BA_only DLPFC and hippocampus runs used 96 and 101
# donors because of the V2 hard-coded `region == "caudate"` filter.
#
# Expected v2 AA analysis-set sizes, reconstructed from the inputs on
# 2026-08-15 (phenotype -> BSobj -> psam, no blacklist):
#
#   caudate      154 -> 154 -> 153
#   dlpfc        119 -> 119 -> 118
#   hippocampus  118 -> 118 -> 117
#
# Note these are NOT the 111 and 116 in vmr-analysis/{dlpfc,hippocampus}/_m/
# samples.txt. Those lists are post-blacklist, and the blacklist is retired in
# v2 (see sample_blacklist below), so v2 should come in 7 and 1 donors higher.
# Recovering ~20 donors per region relative to the legacy 96 and 101 is the
# checkable outcome of the V2 fix.

donor_counts:
  # All three AA cells are LOCKED as of 2026-08-16, from the full-scale runs
  # vmrcat-AA-{caudate,dlpfc,hippocampus}-20260816. Each observed count matched
  # the reconstruction from the inputs (phenotype -> BSobj -> psam) exactly, and
  # the count was identical across all 22 chromosomes within each run.
  #
  #   caudate      154 -> 308 -> 526 psam -> 153
  #   dlpfc        119 -> 119 -> 526 psam -> 118   (legacy 96)
  #   hippocampus  118 -> 180 -> 526 psam -> 117   (legacy 101)
  #
  # dlpfc and hippocampus recover 22 and 16 donors over the legacy counts: the
  # V2 region-filter repair plus the retired blacklist. A mismatch is now a hard
  # stop rather than a warning.
  AA:
    caudate:     { phenotype_n: 154, design_n: 153 }
    dlpfc:       { phenotype_n: 119, design_n: 118 }
    hippocampus: { phenotype_n: 118, design_n: 117 }
  # The all_individuals cells are LOCKED as of 2026-08-16, from the full-scale
  # runs vmrcat-all_individuals-{caudate,dlpfc,hippocampus}-20260816. Each
  # observed count matched the reconstruction from the inputs exactly and was
  # identical across all 22 chromosomes within each run.
  #
  #   caudate      286 -> 1938 psam -> 282
  #   dlpfc        176 -> 1938 psam -> 173
  #   hippocampus  180 -> 1938 psam -> 177
  #
  # Each is the AA count plus the EA donors in that region, with no blacklist.
  all_individuals:
    caudate:     { phenotype_n: 286, design_n: 282 }
    dlpfc:       { phenotype_n: 176, design_n: 173 }
    hippocampus: { phenotype_n: 180, design_n: 177 }

  # Estimation cells on the pooled catalog. design_n is null until the first
  # accepted 01b_estimation_cells run reports observed counts and the PI signs
  # off; assert_expected_n() records and warns while null and hard-stops after.
  #
  # phenotype_n here is the arithmetic reconstruction from the LOCKED counts
  # above -- the two cells partition the pooled analysis set exactly, because
  # race_filter [AA] and [EA] are disjoint and together are the pooled arm's
  # [AA, EA]. It is the number the first run must reproduce, not a lock.
  #
  #   caudate      153 AA + 129 EA = 282
  #   dlpfc        118 AA +  55 EA = 173
  #   hippocampus  117 AA +  60 EA = 177
  #
  # Note these AA cells are NOT the same as the AA arm above: same donors, but a
  # different locus set (pooled discovery) and a different genotype file (the
  # multi-ancestry TOPMed pgen). Their Module 02 scores are ranked in their own
  # cell and are not comparable to the AA arm's.
  # LOCKED 2026-09-18 by Kynon J.M. Benjamin. Each design_n is the donor count
  # the accepted 01b_estimation_cells runs actually materialized, reproduced
  # independently by the accepted Module 02 cell runs:
  #
  #   all_individuals.AA   estcell-...-20260910  153 / 118 / 117
  #   all_individuals.EA   estcell-...-20260910  129 /  55 /  60
  #
  # Every design_n equals its own phenotype_n ceiling, which is the expected
  # identity here and not a coincidence: a cell is a race partition of the
  # pooled arm over a FIXED locus set, so no donor is lost between the
  # phenotype table and the design. A mismatch is now a hard stop
  # (00_shared/identity.R::assert_expected_n) rather than a warning.
  #
  # all_individuals.EA dlpfc (55) and hippocampus (60) are the smallest design
  # cells in the project, roughly half their AA counterparts. Locking the count
  # does not make them adequately powered: per AGENTS.md 7.7 any AA-vs-EA
  # difference is confounded with n, and the donor-group result is a
  # CONCORDANCE statement, never a per-cell effect-size comparison.
  all_individuals.AA:
    caudate:     { phenotype_n: 153, design_n: 153 }
    dlpfc:       { phenotype_n: 118, design_n: 118 }
    hippocampus: { phenotype_n: 117, design_n: 117 }
  all_individuals.EA:
    caudate:     { phenotype_n: 129, design_n: 129 }
    dlpfc:       { phenotype_n: 55,  design_n: 55  }
    hippocampus: { phenotype_n: 60,  design_n: 60  }

  # Tier-3 donor-count sensitivity cells. design_n is LOCKED AT DESIGN TIME
  # here, which is the opposite of every other entry above and is correct: 118
  # is not an observed count to be discovered and then blessed, it is the
  # DLPFC donor count the draw targets. A subset that comes out at any other
  # size is a defect in the draw, so assert_expected_n() must hard-stop on it
  # from the first run rather than record-and-warn.
  #
  # Only caudate is defined. These cells answer a caudate-specific question and
  # a dlpfc or hippocampus entry would invite a run that means nothing.
  AA.n118r1:
    caudate:     { phenotype_n: 118, design_n: 118 }
  AA.n118r2:
    caudate:     { phenotype_n: 118, design_n: 118 }
  AA.n118r3:
    caudate:     { phenotype_n: 118, design_n: 118 }

# Sample blacklist -- RETIRED IN v2. All three regions are null by design.
#
# PI decision (2026-08-15): the legacy blacklists were never a QC exclusion.
# They existed only to reconcile a stale AA phenotype file that was missing
# those donors, so that the all_individuals arm could be matched to the Black
# American-only arm. v2 reads ONE phenotype table
# (inputs/phenotypes/_m/phenotypes-all.tsv) for both arms, so there is nothing
# left to reconcile and the exclusions are dropped.
#
# The eight donors involved (Br1249 Br1303 Br1371 Br1552 Br1693 Br1700 Br1883
# from the DLPFC list, Br1927 from the hippocampus list) are all AA, all present
# in the region BSobjs with usable WGBS data, and all genotyped. They are
# INCLUDED in v2.
#
# AFFIRMED 2026-09-25 after the cross-region sample-integrity screen. The line
# above -- "the legacy blacklists were never a QC exclusion" -- was challenged by
# that screen and has now been tested against it rather than left standing on the
# 2026-08-15 reasoning alone. All eight donors are cleared and remain included.
# Full record: 11_integrated_manuscript_outputs/T4_READMITTED_DONOR_ADJUDICATION.md.
#
# The short version, because a future reader will find the screen before the
# record: on the accepted run fig-all-20260922-c, THREE of the eight are flagged,
# not four (Br1927 is swap_candidate = FALSE in all three of its region pairs and
# is its own best match out of 103 candidates). And none of the three flags is
# coherent with a sample swap. A mislabelled tube is a property of ONE region's
# sample, so it must break BOTH pairs that region participates in; each of
# Br1249, Br1693 and Br1700 is flagged in exactly one pair while the companion
# pair sharing the same candidate tube is clean -- rank 1 of ~102 for Br1249 and
# Br1700. The two donors whose pattern IS swap-coherent, Br1134 (hippocampus) and
# Br1459 (DLPFC), are NOT blacklist donors and are not addressed by this
# affirmation; they remain open for the C->T follow-up.
#
# The screen cannot convict an individual donor by construction: Module 01 masks
# the C->T SNP CpGs (00_prepare.R remove_ct_snps) that give a methylation
# fingerprint its power, so it nominates candidates and does not adjudicate them
# (11_integrated_manuscript_outputs/_h/05_qc_sample_integrity.R:12-22).
#
# Legacy files retained for provenance only, never read by v2:
#   vmr-analysis/all_individuals/dlpfc/_m/samples_blacklist.txt        (7 donors)
#   vmr-analysis/all_individuals/hippocampus/_m/samples_blacklist.txt (1 donor)
#
# The key is kept, and sample_blacklist() with it, so that the per-region
# resolution guard survives: the legacy hippocampus copy read the DLPFC file by
# mistake (all_individuals/hippocampus/_h/02b.res_var.R:81), and nothing here
# may ever fall back to another region's list.
sample_blacklist:
  caudate: null
  dlpfc: null
  hippocampus: null
