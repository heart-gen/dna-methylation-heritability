# CpG-level cis-meQTL mapping parameters (prespecified; do not tune after results)

genome_build: hg38
cis_window_bp: 500000
cis_window_sensitivity_bp: 1000000

predictability_score_column: local_snp_contribution_score_z
predictability_class_column: local_snp_contribution_quartile  # secondary only

genotype_qc:
  chromosomes: autosomal
  maf_min: 0.05
  imputation_r2_min: 0.8
  missingness_max: 0.05
  hwe_p_min: 1.0e-6

cpg_qc:
  within_vmr: true
  min_coverage: 5
  min_fraction_samples_passing_coverage: 0.8
  require_nonzero_variance: true
  exclude_blacklist: true
  exclude_common_ct_snp_at_cpg: true
  common_snp_maf_min: 0.05
  methylation_source: non_residualized  # cpg_meth.phen
  residualized_allowed_as: negative_control_sensitivity_only
  # Phen matrices from Alexis pipeline already apply min_coverage in
  # >= min_fraction_samples_passing_coverage. Real depth for Phase 2/6 is
  # extracted by 06_extract_cpg_coverage.R from stats.rda BSobj getCoverage().
  coverage_source: stats.rda_BSobj_getCoverage
  coverage_proxy_fallback: fraction_nonmissing  # only if stats.rda unavailable

mapping:
  engine: tensorqtl
  mode_primary: cis_nominal_and_permutation
  seed: 20260722
  fdr_method: storey_qvalue
  fdr_threshold: 0.05
  fdr_family: per_brain_region
  primary_population: AA
  region_order:
    - caudate
    - dlpfc
    - hippocampus

outputs_required:
  - nominal_p
  - beta
  - se
  - statistic
  - qvalue_or_perm_fdr
  - lead_snp_per_cpg
  - n_tested_snps_per_cpg

qc_plots_required:
  - pvalue_histogram
  - qq_plot
  - genomic_inflation
  - effect_size_distribution
  - lead_snp_maf_distribution
  - lead_snp_distance_distribution
  - chromosome_result_counts
  - covariate_model_comparison
  - positive_control_public_meqtl_overlap

# Genomic-inflation acceptance band, read by 03_vmr_burden.R (a hard gate on the
# burden) and 04_check_burden.R (a gate criterion). the locked analysis plan requires
# inflation to be resolved before the figure freeze.
#
# The statistic is the median chi-square over DISTAL nominal cis pairs only:
# those with |CpG-to-SNP distance| > distal_min_distance_bp. Lambda over ALL cis
# pairs is not an inflation estimate, because cis pairs are enriched for true
# meQTLs and a well-behaved scan therefore has lambda > 1 by construction.
#
# Evidence (AA caudate, chr22, 13.0M nominal pairs): lambda falls monotonically
# with distance -- 1.234 over all pairs, 1.146 beyond 100 kb, 1.113 beyond
# 250 kb, 1.087 beyond 400 kb. That decay is the signature of real cis signal,
# not of global inflation, so the far edge of the +/-500 kb window is used as
# the null proxy. The all-pair figure is still recorded as `lambda_all_pairs`
# and the full decay profile as qc/genomic-inflation-by-distance.tsv.
# Donor-robust inference for the DLPFC-hippocampus burden slope (TASKS.md A3,
# added 2026-10-07). Read by _h/06-08. Module 08 tier 2 reads the slope as
# differing between the two regions (2.094 vs 2.367), using an
# independent-HC3 SE whose calibration is unknown; the locked analysis plan requires
# donor-robust inference before that difference may be written.
#
# Resampling is a PAIRED DELETE-d DONOR JACKKNIFE, not a bootstrap. The smoke
# run of a paired bootstrap (2026-10-07, 4 draws, unsealed and deleted) called
# EVERY tested CpG significant at q <= 0.05 in every draw (134k of 134k DLPFC,
# against 84k in the accepted cell; Storey pi0 -0.003 against 0.31). On chr22
# the median CpG p fell from 0.0098 to 3e-4. A resample with duplicated donors
# carries the duplication in both genotype and phenotype, while the permutation
# null shuffles it apart, so the null is too narrow and every CpG looks like an
# meQTL. That is a property of bootstrap + permutation p-values, not a code
# defect, and it left the bootstrap variance at exactly zero. Drawing donors
# WITHOUT replacement keeps every permutation valid.
#
# Each draw deletes the same delete_fraction of the UNION of the two regions'
# donors from both regions (simple random, unstratified), and each region maps
# the donors it has left. A region's slope is a function of the union sample
# that ignores donors it lacks, so one (n, d) applies to both slopes and to
# their difference. Variance (Shao & Wu 1989, random subsets):
#   v = (n - d) / (d * B) * sum_b (theta_b - mean(theta))^2
# d = 20% of n sits between sqrt(n) and n, as the delete-d jackknife needs for a
# non-smooth statistic, while keeping each draw's mapping power close to the
# full sample's.
#
# draw_nperm is 1,000, not the cells' tensorqtl default of 10,000. Chosen
# BEFORE any draw was mapped, on a chr22 DLPFC probe of the accepted cell's own
# inputs:
#   - 10,000 permutations reproduced the sealed pval_beta to |dlog10 p| 2e-6;
#   - 1,000 permutations ran 4.6x faster (1.29 vs 5.94 min);
#   - log10 pval_beta Spearman 0.9998 against 10,000, with 99.5% / 99.8% call
#     agreement at p < 1e-3 / 1e-4.
# Monte-Carlo noise in pval_beta can only add to the variance, so the cheaper
# setting errs conservative. 200 draws put the Monte-Carlo error of the donor SE
# at about 5%.
cross_region_slope_inference:
  contrast: [dlpfc, hippocampus]   # tier 2: the one contrast inside batches 1-2
  resampling: paired_delete_d_donor_jackknife
  draws_n: 200
  smoke_draws_n: 4
  delete_fraction: 0.20
  draw_nperm: 1000
  draws_per_task: 10
  seed: 20261007
  ci_level: 0.95

genomic_inflation:
  statistic: distal_cis_pairs
  distal_min_distance_bp: 400000
  min: 0.90
  max: 1.15

vmr_aggregation_metrics:
  - vmr_id
  - local_predictability
  - predictability_class
  - n_tested_cpgs
  - n_cpgs_with_sig_meqtl
  - proportion_cpgs_with_sig_meqtl
  - min_cpg_pvalue
  - strongest_abs_beta
  - strongest_lead_snp_r2
  - n_distinct_lead_snps
  - median_cpg_lead_snp_distance
  - public_meqtl_support
  - vmr_mean_methylation
  - vmr_methylation_variance
  - average_cpg_coverage
  - vmr_length
  - cpg_density
  - local_snp_count
  - local_common_snp_density
  - repeat_overlap
  - mappability
  - genomic_annotation
  - chromatin_annotation
